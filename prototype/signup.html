<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — AI Matchmaker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: {
            50: '#f7f5fc', 100: '#efe7fa', 200: '#dccdf3', 300: '#c3a8e8',
            400: '#a47ad9', 500: '#8656c8', 600: '#6d3fb0', 700: '#5a3491',
            800: '#4a2c76', 900: '#3d2660',
          },
        },
        fontFamily: { serif: ['Georgia', 'Cambria', '"Times New Roman"', 'serif'] },
      },
    },
  };
</script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex items-center justify-center px-6 py-12">

  <div class="w-full max-w-sm">
    <a href="index.html" class="flex flex-col items-center gap-2 mb-8">
      <div class="w-10 h-10 rounded-full bg-accent-100 text-accent-700 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9L12 2.5z"/></svg>
      </div>
      <span class="font-serif text-lg text-stone-900">AI Matchmaker</span>
    </a>

    <div class="bg-white border border-stone-200 rounded-2xl p-7">
      <h1 class="font-serif text-xl text-stone-900 mb-1">Create your account</h1>
      <p class="text-sm text-stone-500 mb-6">Takes two minutes. The real getting-to-know-you part happens in conversation, right after.</p>

      <button type="button" data-auth-google data-auth-redirect="onboarding.html" class="w-full flex items-center justify-center gap-2.5 border border-stone-300 text-stone-700 font-medium rounded-full py-2.5 hover:bg-stone-50 transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 01-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3a7.4 7.4 0 01-11-3.89H1.08v3.09A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.07 14.2a7.2 7.2 0 010-4.4V6.71H1.08a12 12 0 000 10.58l3.99-3.09z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.35.6 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 001.08 6.71l3.99 3.09A7.16 7.16 0 0112 4.75z"/></svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-stone-200"></div>
        <span class="text-xs font-medium text-stone-400">OR</span>
        <div class="flex-1 h-px bg-stone-200"></div>
      </div>

      <p class="text-xs font-medium text-stone-500 mb-3">Create account with Email</p>

      <form data-auth-form data-auth-redirect="onboarding.html" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-stone-500 mb-1.5">Name</label>
          <input type="text" required placeholder="Jordan Ellis" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-accent-300" />
        </div>
        <div>
          <label class="block text-xs font-medium text-stone-500 mb-1.5">Email</label>
          <input type="email" required placeholder="you@example.com" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-accent-300" />
        </div>
        <div>
          <label class="block text-xs font-medium text-stone-500 mb-1.5">Password</label>
          <input type="password" required placeholder="At least 8 characters" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-accent-300" />
        </div>
        <button type="submit" class="w-full bg-accent-600 text-white font-medium rounded-full py-2.5 hover:bg-accent-700 transition">Create Account</button>
        <p class="text-xs text-stone-400 text-center leading-relaxed">By signing up, you agree to our <a href="terms-of-service.html" class="text-accent-700 hover:underline">Terms of Service</a> and <a href="privacy-policy.html" class="text-accent-700 hover:underline">Privacy Policy</a>.</p>
      </form>
    </div>

    <p class="text-center text-sm text-stone-500 mt-6">Already have an account? <a href="login.html" class="text-accent-700 font-medium hover:underline">Log in</a></p>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
