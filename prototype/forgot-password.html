<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — AI Matchmaker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: {
            50: '#f7f5fc', 100: '#efe7fa', 200: '#dccdf3', 300: '#c3a8e8',
            400: '#a47ad9', 500: '#8656c8', 600: '#6d3fb0', 700: '#5a3491',
            800: '#4a2c76', 900: '#3d2660',
          },
        },
        fontFamily: { serif: ['Georgia', 'Cambria', '"Times New Roman"', 'serif'] },
      },
    },
  };
</script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex items-center justify-center px-6 py-12">

  <div class="w-full max-w-sm">
    <a href="index.html" class="flex flex-col items-center gap-2 mb-8">
      <div class="w-10 h-10 rounded-full bg-accent-100 text-accent-700 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9L12 2.5z"/></svg>
      </div>
      <span class="font-serif text-lg text-stone-900">AI Matchmaker</span>
    </a>

    <div class="bg-white border border-stone-200 rounded-2xl p-7">
      <div data-forgot-form-state>
        <h1 class="font-serif text-xl text-stone-900 mb-1">Reset your password</h1>
        <p class="text-sm text-stone-500 mb-6">Enter your email and we'll send you a link to reset it.</p>
        <form data-forgot-form class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-stone-500 mb-1.5">Email</label>
            <input type="email" required placeholder="you@example.com" class="w-full text-sm border border-stone-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-accent-300" />
          </div>
          <button type="submit" class="w-full bg-accent-600 text-white font-medium rounded-full py-2.5 hover:bg-accent-700 transition">Send reset link</button>
        </form>
      </div>
      <div data-forgot-sent-state class="hidden text-center">
        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H9l-4 4v-4H6a2 2 0 01-2-2V6z"/></svg>
        </div>
        <h1 class="font-serif text-xl text-stone-900 mb-1">Check your email</h1>
        <p class="text-sm text-stone-500 leading-relaxed">If an account exists for that address, we've sent a link to reset your password. It expires in 1 hour.</p>
        <a href="reset-password.html" class="inline-block mt-5 text-sm font-medium text-accent-700 hover:underline">Continue to reset password (prototype) →</a>
      </div>
    </div>

    <p class="text-center text-sm text-stone-500 mt-6">Remembered your password? <a href="login.html" class="text-accent-700 font-medium hover:underline">Log in</a></p>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
